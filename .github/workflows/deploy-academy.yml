name: Deploy Viva Academy

# Выкладывает папку academy/ на сервер vivaacademy.md после каждого
# изменения в ветке main. Настройка — docs/DEPLOY.md.

on:
  push:
    branches: [main]
    paths:
      - 'academy/**'
      - '.github/workflows/deploy-academy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-academy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PHP syntax
        run: for f in academy/api/*.php; do php -l "$f"; done

      - name: Check deploy settings
        id: cfg
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Секреты DEPLOY_* не заданы — выкладка пропущена. См. docs/DEPLOY.md"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to server
        if: steps.cfg.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for v in DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then echo "::error::Не задан секрет $v (см. docs/DEPLOY.md)"; exit 1; fi
          done
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Ключ, вставленный с телефона, часто теряет переносы строк или
          # получает лишние пробелы и «длинные» тире — восстанавливаем формат.
          python3 - > ~/.ssh/deploy_key <<'PY'
          import os, re, sys, textwrap
          raw = os.environ['DEPLOY_SSH_KEY']
          k = re.sub(r'[\u200b-\u200d\u2060\ufeff\r]', '', raw)
          k = re.sub(r'[\u00a0\u2000-\u200a\u202f\u205f\u3000]', ' ', k)
          k = re.sub(r'[\u2010-\u2015\u2212]', '-', k)
          lines = [l for l in k.split('\n') if l.strip()]
          print('Ключ: %d симв., %d строк, BEGIN: %s, END: %s' % (len(raw), len(lines),
                'да' if re.search(r'\bbegin\b', k, re.I) else 'нет', 'да' if re.search(r'\bend\b', k, re.I) else 'нет'), file=sys.stderr)
          m = re.search(r'-*\s*BEGIN\s+([A-Z][A-Z ]*?PRIVATE\s+KEY)\s*-+(.*?)-+\s*END\s+[A-Z ]*?PRIVATE\s+KEY\s*-*', k, re.S | re.I)
          if m:
              kind, body = re.sub(r'\s+', ' ', m.group(1)).upper(), m.group(2)
          else:
              kind, body = 'OPENSSH PRIVATE KEY', re.sub(r'(?i)-*\s*(BEGIN|END)[^-]*-*', '', k)
          body = re.sub(r'[^A-Za-z0-9+/=]', '', body)
          if not body.startswith(('b3BlbnNzaC1rZXktdjE', 'MII')):
              sys.exit('::error::DEPLOY_SSH_KEY не похож на закрытый SSH-ключ — внесите его заново целиком, от строки BEGIN до строки END')
          if body.startswith('MII') and kind == 'OPENSSH PRIVATE KEY':
              kind = 'PRIVATE KEY'
          print('-----BEGIN %s-----\n%s\n-----END %s-----' % (kind, '\n'.join(textwrap.wrap(body, 70)), kind))
          PY
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY повреждён или защищён паролем — внесите ключ заново (см. docs/DEPLOY.md)"
            exit 1
          fi
          echo "Ключ прочитан, отпечаток: $(ssh-keygen -lf ~/.ssh/deploy_key | awk '{print $2}')"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          # Только добавляем и перезаписываем файлы сайта: ничего не удаляем,
          # настройки базы, данные и установщик на сервере не трогаем.
          rsync -rlvz --checksum --chmod=D755,F644 \
            --exclude 'api/config.php' \
            --exclude 'api/install.php' \
            --exclude 'data/' \
            --exclude 'tools/' \
            --exclude 'README.md' \
            --exclude '.gitignore' \
            -e "ssh -i $HOME/.ssh/deploy_key -p ${DEPLOY_PORT:-22} -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            academy/ "$DEPLOY_USER@$DEPLOY_HOST:${DEPLOY_PATH%/}/"

      - name: Check the site answers
        if: steps.cfg.outputs.configured == 'true'
        run: |
          curl -fsS --max-time 30 https://vivaacademy.md/ -o /dev/null
          curl -fsS --max-time 30 "https://vivaacademy.md/api/index.php?action=me" | grep -q '"csrf"'
          echo "Сайт отвечает, API работает"
